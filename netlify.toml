[build]
  command = "npm run build"
  publish = "dist"
  # only main deploys (the production site): deploy previews and branch deploys are skipped before
  # they build, to save build credits (exit 0 = skip)
  ignore = "[ \"$CONTEXT\" != \"production\" ]"

# the whole site sits behind a shared password (netlify/edge-functions/password.ts; set SITE_PASSWORD in the Netlify project, or the site stays shut)
[[edge_functions]]
  function = "password"
  path = "/*"
