<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Edelweiss Edge — prototype</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0f2236" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Ueli on the mountain. Drag on the mountain to move your window."></canvas>

      <section class="deck" id="deck" aria-label="Controls">
        <div class="grp diffs" role="radiogroup" aria-label="Difficulty">
          <button type="button" data-difficulty="easy">Easy<small>8 steps</small></button>
          <button type="button" data-difficulty="medium">Medium<small>5 steps</small></button>
          <button type="button" data-difficulty="hard">Hard<small>3 steps</small></button>
          <button type="button" data-difficulty="pinpoint">Pinpoint<small>1 step</small></button>
          <button type="button" data-difficulty="edge" class="edge">Edge<small>he falls</small></button>
        </div>

        <div class="grp stepper" id="stepper">
          <button type="button" id="nudge-down" aria-label="Move the window down a step">◀</button>
          <div class="where"><b id="window-label">Steps 11–15</b><small id="window-alt">2’552–2’680 m</small></div>
          <button type="button" id="nudge-up" aria-label="Move the window up a step">▶</button>
        </div>

        <div class="grp odds">
          <span class="pays" id="pays">4.0×</span>
          <small id="chance">wins 1 in 5.4</small>
        </div>

        <div class="grp bet">
          <button type="button" id="bet-down" aria-label="Lower the bet" data-social-label="Lower the play amount">−</button>
          <div class="where"><small data-social="Play amount">Bet</small><b id="bet">…</b></div>
          <button type="button" id="bet-up" aria-label="Raise the bet" data-social-label="Raise the play amount">+</button>
        </div>

        <button type="button" class="climb" id="climb">Climb!</button>

        <div class="grp meta">
          <span class="balance"><small>Balance</small> <b id="balance">…</b></span>
          <button type="button" class="sound" id="sound" aria-pressed="true">Sound on</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </section>

      <p class="sr-only" id="callout" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
