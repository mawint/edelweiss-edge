<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Edelweiss Edge — prototype</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1d3557" />
  </head>
  <body>
    <!-- Placeholder screen: the art style isn't chosen yet. It plays real books through the RGS (or the mock). -->
    <main id="app">
      <header class="top">
        <h1>Edelweiss Edge</h1>
        <p class="tag">Placeholder: no art yet</p>
        <div class="balance"><small>Balance</small> <b id="balance">…</b></div>
      </header>

      <section class="ridge-wrap" aria-label="The ridge">
        <div class="ridge" id="ridge"></div>
        <div class="callout" id="callout" aria-live="polite"></div>
      </section>

      <section class="controls">
        <div class="difficulty" id="difficulty" role="radiogroup" aria-label="Difficulty">
          <button type="button" data-difficulty="easy">Easy</button>
          <button type="button" data-difficulty="medium">Medium</button>
          <button type="button" data-difficulty="hard">Hard</button>
          <button type="button" data-difficulty="pinpoint">Pinpoint</button>
          <button type="button" data-difficulty="edge">Over the Edge</button>
        </div>
        <label class="slider" id="slider-row">
          <span>Window</span>
          <input type="range" id="slider" min="0" max="18" step="1" value="10" />
          <output id="window-label"></output>
        </label>
        <p class="pays" id="pays"></p>
        <div class="row">
          <div class="bet">
            <button type="button" id="bet-down" aria-label="Lower the bet" data-social-label="Lower the play amount">−</button>
            <span><small data-social="Play amount">Bet</small> <b id="bet">…</b></span>
            <button type="button" id="bet-up" aria-label="Raise the bet" data-social-label="Raise the play amount">+</button>
          </div>
          <button type="button" class="climb" id="climb">Climb</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
