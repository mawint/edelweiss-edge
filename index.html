<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Edelweiss Edge — prototype</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0f2236" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Ueli on the mountain. Drag the sign over your window to move it, or use the arrow keys."></canvas>

      <button type="button" class="corner-sound" id="sound-corner" aria-pressed="true" aria-label="Sound on" title="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9h4l5-4v14l-5-4H3z" /><path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" /><path class="mute" d="M16 9l6 6M22 9l-6 6" /></svg>
      </button>

      <section class="deck" id="deck" aria-label="Controls">
        <button type="button" class="icon" id="menu-open" aria-label="Menu">☰</button>
        <button type="button" class="pick" id="diff-open" aria-haspopup="dialog"><small>Difficulty</small><b id="diff-label">Medium</b></button>
        <div class="bet">
          <button type="button" id="bet-down" aria-label="Lower the bet" data-social-label="Lower the play amount">−</button>
          <div class="val"><small data-social="Play amount">Bet</small><b id="bet">…</b></div>
          <button type="button" id="bet-up" aria-label="Raise the bet" data-social-label="Raise the play amount">+</button>
        </div>
        <div class="val balance"><small>Balance</small><b id="balance">…</b></div>
        <div class="go">
          <button type="button" class="icon side" id="turbo" aria-pressed="false" aria-label="Turbo: play the climb twice as fast" title="Turbo">»<small>Turbo</small></button>
          <button type="button" class="climb" id="climb"><span>Climb!</span></button>
          <button type="button" class="icon side" id="auto-open" aria-haspopup="dialog" aria-label="Autoplay" title="Autoplay">↻<small>Auto</small></button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </section>

      <dialog class="sheet" id="diff-sheet" aria-labelledby="diff-title">
        <header><h2 id="diff-title">Difficulty</h2><button type="button" class="icon close" aria-label="Close">✕</button></header>
        <p class="lead">How wide is your window? Narrower windows win less often, so they win more.</p>
        <div class="choices" id="diff-list"></div>
      </dialog>

      <dialog class="sheet" id="menu-sheet" aria-labelledby="menu-title">
        <header><h2 id="menu-title">Menu</h2><button type="button" class="icon close" aria-label="Close">✕</button></header>
        <div class="toggles">
          <button type="button" class="toggle" id="sound" aria-pressed="true">Sound <b>On</b></button>
        </div>
        <article class="rules" id="rules"></article>
      </dialog>

      <dialog class="sheet" id="auto-sheet" aria-labelledby="auto-title">
        <header><h2 id="auto-title">Autoplay</h2><button type="button" class="icon close" aria-label="Close">✕</button></header>
        <p class="lead" data-social="Ueli climbs again and again with your difficulty, window and play amount. You can stop any time.">Ueli climbs again and again with your difficulty, window and bet. You can stop any time.</p>
        <div class="rounds" id="auto-rounds" role="radiogroup" aria-label="Number of climbs">
          <button type="button" data-rounds="10">10</button>
          <button type="button" data-rounds="25" aria-pressed="true">25</button>
          <button type="button" data-rounds="50">50</button>
          <button type="button" data-rounds="100">100</button>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="auto-stop-win" /> Stop after any win</label>
          <label><input type="checkbox" id="auto-stop-big" checked /> Stop after a win of 20× or more</label>
        </div>
        <button type="button" class="climb start" id="auto-start"><span>Start 25 climbs</span></button>
      </dialog>

      <!-- The loader, full page (the studio pattern from Midnight Meridian and Crush Depth): studio, game logo,
           progress, then "tap to climb". The tap is also what lets the browser play sound. -->
      <section class="loader" id="splash" aria-labelledby="splash-title">
        <svg class="range" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
          <polygon points="0,150 110,40 200,110 320,20 450,120 560,50 680,130 800,30 920,110 1000,60 1000,300 0,300" fill="#e5949f" stroke="#24152e" stroke-width="4" stroke-linejoin="round" />
          <polygon points="320,20 290,62 320,52 345,66" fill="#ffedef" /><polygon points="800,30 772,68 800,58 826,72" fill="#ffedef" />
          <polygon points="0,220 90,140 190,200 300,120 420,190 540,130 650,210 760,140 880,200 1000,150 1000,300 0,300" fill="#7a68a8" stroke="#24152e" stroke-width="4" stroke-linejoin="round" />
          <polygon points="300,120 276,154 300,146 322,160" fill="#f1ecff" /><polygon points="760,140 738,172 760,164 782,176" fill="#f1ecff" />
        </svg>
        <!-- Things drifting through the sky while it loads, like the game's own flyers -->
        <div class="sky" aria-hidden="true">
          <svg class="cloud c1" viewBox="-40 -40 160 80"><g stroke="#24152e" stroke-width="7"><ellipse cx="0" cy="0" rx="34" ry="27" /><ellipse cx="36" cy="-14" rx="40" ry="32" /><ellipse cx="78" cy="0" rx="30" ry="24" /><ellipse cx="40" cy="10" rx="34" ry="27" /></g><g fill="#fff3e6"><ellipse cx="0" cy="0" rx="34" ry="27" /><ellipse cx="36" cy="-14" rx="40" ry="32" /><ellipse cx="78" cy="0" rx="30" ry="24" /><ellipse cx="40" cy="10" rx="34" ry="27" /></g></svg>
          <svg class="cloud c2" viewBox="-40 -40 160 80"><g stroke="#24152e" stroke-width="7"><ellipse cx="0" cy="0" rx="34" ry="27" /><ellipse cx="36" cy="-14" rx="40" ry="32" /><ellipse cx="78" cy="0" rx="30" ry="24" /><ellipse cx="40" cy="10" rx="34" ry="27" /></g><g fill="#fff3e6"><ellipse cx="0" cy="0" rx="34" ry="27" /><ellipse cx="36" cy="-14" rx="40" ry="32" /><ellipse cx="78" cy="0" rx="30" ry="24" /><ellipse cx="40" cy="10" rx="34" ry="27" /></g></svg>
          <svg class="cloud c3" viewBox="-40 -40 160 80"><g stroke="#24152e" stroke-width="7"><ellipse cx="0" cy="0" rx="34" ry="27" /><ellipse cx="36" cy="-14" rx="40" ry="32" /><ellipse cx="78" cy="0" rx="30" ry="24" /><ellipse cx="40" cy="10" rx="34" ry="27" /></g><g fill="#fff3e6"><ellipse cx="0" cy="0" rx="34" ry="27" /><ellipse cx="36" cy="-14" rx="40" ry="32" /><ellipse cx="78" cy="0" rx="30" ry="24" /><ellipse cx="40" cy="10" rx="34" ry="27" /></g></svg>
          <svg class="balloon" viewBox="-60 -70 120 165"><defs><clipPath id="env"><path d="M0 60C-50 20-56-60 0-64C56-60 50 20 0 60Z" /></clipPath></defs>
            <g clip-path="url(#env)"><rect x="-60" y="-70" width="120" height="140" fill="#fff" /><rect x="-40" y="-70" width="16" height="140" fill="#e2383f" /><rect x="-8" y="-70" width="16" height="140" fill="#e2383f" /><rect x="24" y="-70" width="16" height="140" fill="#e2383f" /></g>
            <path d="M0 60C-50 20-56-60 0-64C56-60 50 20 0 60Z" fill="none" stroke="#24152e" stroke-width="4" />
            <path d="M-8 58L-10 76M8 58L10 76" stroke="#24152e" stroke-width="3" /><rect x="-12" y="74" width="24" height="16" rx="3" fill="#a8743e" stroke="#24152e" stroke-width="3" /></svg>
          <svg class="glider" viewBox="-60 -40 120 120"><path d="M-50 0Q0-34 50 0Q0-18-50 0Z" fill="#ffc93c" stroke="#24152e" stroke-width="4" stroke-linejoin="round" /><path d="M-30-10L0 46M-10-14L0 46M10-14L0 46M30-10L0 46" stroke="#24152e" stroke-width="1.6" /><circle cx="0" cy="52" r="6" fill="#f7c8a0" stroke="#24152e" stroke-width="2.5" /><rect x="-6" y="56" width="12" height="14" rx="4" fill="#e2383f" stroke="#24152e" stroke-width="2.5" /></svg>
          <svg class="birds" viewBox="-130 -30 160 60"><g fill="none" stroke="#24152e" stroke-width="3.5" stroke-linecap="round"><path class="w" d="M-10-4Q-4-6 0 0Q4-6 10-4" /><path class="w" d="M-36 8Q-30 6-26 12Q-22 6-16 8" /><path class="w" d="M-62 20Q-56 18-52 24Q-48 18-42 20" /><path class="w" d="M-88 8Q-82 6-78 12Q-74 6-68 8" /><path class="w" d="M-114-4Q-108-6-104 0Q-100-6-94-4" /></g></svg>
        </div>
        <div class="studio"><img src="/copperwick-mark.svg" alt="" width="34" height="40" /><span>Copperwick Studios</span></div>
        <div class="logo">
          <svg class="flower" viewBox="-50 -50 100 100" aria-hidden="true">
            <g stroke="#24152e" stroke-width="4" stroke-linejoin="round">
              <ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(0)" /><ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(45)" />
              <ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(90)" /><ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(135)" />
              <ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(180)" /><ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(225)" />
              <ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(270)" /><ellipse cx="0" cy="-27" rx="11" ry="24" fill="#fff" transform="rotate(315)" />
              <circle r="13" fill="#ffc93c" />
            </g>
          </svg>
          <h1 id="splash-title">Edelweiss Edge</h1>
        </div>
        <div class="load" id="load" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="track"><i id="load-bar"></i></div>
          <small id="load-text" aria-live="polite">Loading</small>
        </div>
        <button type="button" class="tap" id="play" hidden><span>Tap to climb</span></button>
        <div class="fatal" id="fatal" role="alert" hidden>
          <b>Couldn't start the game</b>
          <span id="splash-error"></span>
          <button type="button" id="retry">Reload</button>
        </div>
      </section>

      <p class="sr-only" id="callout" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
